<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Event Rules — EMINENCE 2K26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rules.css">
</head>
<body>

<canvas id="stars"></canvas>

<!-- ══ HEADER ══ -->
<header class="rules-header">
  <div class="header-brand">
    <div class="header-logo">EMINENCE 2K26</div>
    <div class="header-sub">Event Rules</div>
  </div>
  <nav class="header-nav">
    <button class="nav-btn" id="backBtn" onclick="showGrid()">← All Events</button>
    <a class="nav-btn" href="index.html">🏠 Home</a>
    <a class="nav-btn register" id="headerRegister" href="#" target="_blank" rel="noopener" style="display:none">Register →</a>
  </nav>
</header>

<main id="rulesApp">
  <p class="loading-msg">Loading events…</p>
</main>

<script>
/* ════════════════════════════════
   DATA
════════════════════════════════ */
let _events = null;

document.addEventListener('DOMContentLoaded', () => {
  Promise.all([
    fetch('events.json').then(r => { if (!r.ok) throw new Error('Cannot load events.json'); return r.json(); }),
    fetch('rulebook.json').then(r  => { if (!r.ok) throw new Error('Cannot load rulebook.json');  return r.json(); })
  ])
  .then(([ev, ru]) => {
    _events = ev;
    window._rules = ru;
    initStarfield();
    router();
  })
  .catch(err => {
    document.getElementById('rulesApp').innerHTML = `<p class="loading-msg">⚠️ ${err.message}</p>`;
  });

  window.addEventListener('hashchange', router);
});

/* ════════════════════════════════
   ROUTER
════════════════════════════════ */
function router() {
  const m = location.hash.match(/^#event\/([^/]+)\/(\d+)$/);
  if (m) {
    const cat = _events?.categories.find(c => c.id === m[1]);
    const ev  = cat?.events[+m[2]];
    if (cat && ev) { showDetail(cat, ev, +m[2]); return; }
  }
  showGrid();
}

/* ════════════════════════════════
   GRID VIEW
════════════════════════════════ */
function showGrid() {
  document.getElementById('backBtn').style.display        = 'none';
  document.getElementById('headerRegister').style.display = 'none';
  document.title = 'Event Rules — EMINENCE 2K26';
  if (location.hash.startsWith('#event')) history.pushState('', '', location.pathname);

  const app = document.getElementById('rulesApp');
  app.innerHTML = '';

  // Hero
  const hero = el('div', { class: 'page-hero' });
  hero.innerHTML = `
    <div class="page-hero-label">EMINENCE 2K26</div>
    <h1 class="page-hero-title">Event Rules</h1>
    <p class="page-hero-sub">Select an event to read its rules &amp; regulations</p>
  `;
  app.appendChild(hero);

  // Category sections
  _events.categories.forEach(cat => {
    const nt  = cat.theme === 'nontech';
    const sec = el('div', { class: 'cat-section' });
    sec.innerHTML = `
      <div class="cat-heading-row">
        <div class="cat-heading-line ${nt ? 'nl' : ''}"></div>
        <h2 class="cat-heading-title ${cat.theme}">${cat.emoji} ${esc(cat.label)}</h2>
        <div class="cat-heading-line ${nt ? 'nr' : 'r'}"></div>
      </div>
    `;

    const grid = el('div', { class: `rules-grid${nt ? ' nontech-grid' : ''}` });
    cat.events.forEach((ev, i) => {
      const card = el('div', { class: 'rules-card', role: 'button', tabindex: '0', style: `animation-delay:${i*0.06}s` });
      card.innerHTML = `
        <div class="rc-emoji">${ev.emoji}</div>
        <div class="rc-name">${esc(ev.name)}</div>
        <div class="rc-hint">View Rules →</div>
      `;
      card.addEventListener('click', () => { location.hash = `#event/${cat.id}/${i}`; });
      card.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') location.hash=`#event/${cat.id}/${i}`; });
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    app.appendChild(sec);
  });

  window.scrollTo({ top: 0, behavior: 'instant' });
  initCardReveal();
}

/* ════════════════════════════════
   DETAIL VIEW
════════════════════════════════ */
function showDetail(cat, ev, idx) {
  const nt  = cat.theme === 'nontech';
  const key = `${cat.id}__${idx}`;
  const r   = (window._rules || {})[key] || {};

  // Header
  document.getElementById('backBtn').style.display = 'inline-flex';
  const regBtn = document.getElementById('headerRegister');
  regBtn.style.display = 'inline-flex';
  regBtn.href = ev.link || '#';
  document.title = `${ev.name} Rules — EMINENCE 2K26`;

  const app = document.getElementById('rulesApp');
  app.innerHTML = '';

  const wrap = el('div', { class: `detail-wrap${nt ? ' nontech' : ''}` });
  const nc   = nt ? ' nontech-card' : '';

  // ── 1. HERO ──
  wrap.appendChild(buildHero(ev, r, cat));

  // ── 2. ABOUT ──
  if (r.about) wrap.appendChild(buildCard('📖', 'About', nc, `<p class="about-text">${esc(r.about)}</p>`));

  // ── 3. COORDINATORS ──
  if (r.coordinators?.length) wrap.appendChild(buildCard('📞', 'Coordinators', nc, buildCoordinators(r.coordinators)));

  // ── 4. ROUNDS ──
  if (r.rounds?.length) wrap.appendChild(buildCard('🏁', 'Competition Structure', nc, buildRounds(r.rounds, nt)));

  // ── 5. RULES ──
  if (r.rules?.length) wrap.appendChild(buildCard('📋', 'Rules & Regulations', nc, buildRules(r.rules)));

  // ── 6. SCORING TABLE ──
  if (r.scoring) wrap.appendChild(buildCard('🏆', 'Points System', nc, buildScoring(r.scoring)));

  // ── 7. JUDGING ──
  if (r.judging?.length) wrap.appendChild(buildCard('⚖️', 'Evaluation & Judging', nc, buildJudging(r.judging)));

  // ── 8. DISQUALIFICATION ──
  if (r.disqualification?.length) wrap.appendChild(buildCard('🚫', 'Disqualification Criteria', ' dq-card', buildDQ(r.disqualification)));

  // ── 9. CTA ──
  const cta = el('div', { class: 'detail-cta' });
  cta.innerHTML = `
    <a class="cta-btn cta-register" href="${esc(ev.link||'#')}" target="_blank" rel="noopener">✦ Register Now</a>
    <button class="cta-btn cta-back" onclick="showGrid()">← All Events</button>
  `;
  wrap.appendChild(cta);

  app.appendChild(wrap);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ════════════════════════════════
   BUILDERS
════════════════════════════════ */

function buildHero(ev, r, cat) {
  const div = el('div', { class: 'detail-hero' });
  const feeChip      = r.fee      ? `<span class="meta-chip gold">💰 ${esc(r.fee)}</span>` : '';
  const teamChip     = r.team     ? `<span class="meta-chip">👥 ${esc(r.team)}</span>` : '';
  const durationChip = r.duration ? `<span class="meta-chip purple">⏱ ${esc(r.duration)}</span>` : '';
  const catChip      = `<span class="meta-chip pink">${esc(cat.label)}</span>`;

  div.innerHTML = `
    <span class="detail-emoji">${ev.emoji}</span>
    <h1 class="detail-name">${esc(ev.name)}</h1>
    ${r.tagline ? `<p class="detail-tagline">${esc(r.tagline)}</p>` : ''}
    <div class="detail-meta">
      ${feeChip}${teamChip}${durationChip}${catChip}
    </div>
  `;
  return div;
}

function buildCard(icon, title, extraClass, bodyHTML) {
  const card = el('div', { class: `info-card${extraClass}` });
  card.innerHTML = `
    <div class="info-card-header">
      <span class="info-card-icon">${icon}</span>
      <span class="info-card-title">${title}</span>
    </div>
    <div class="info-card-body">${bodyHTML}</div>
  `;
  return card;
}

function buildCoordinators(coords) {
  const chips = coords.map(c => `
    <div class="coord-chip">
      <span class="coord-name">${esc(c.name)}</span>
      <span class="coord-sep">·</span>
      <span class="coord-phone">📞 ${esc(c.phone)}</span>
    </div>
  `).join('');
  return `<div class="coordinators-grid">${chips}</div>`;
}

function buildRounds(rounds, isNontech) {
  const items = rounds.map((rd, i) => {
    const criteria = rd.judging_criteria?.length
      ? `<div class="round-criteria">${rd.judging_criteria.map(c => `<span class="criteria-tag">${esc(c)}</span>`).join('')}</div>`
      : '';
    return `
      <div class="round-item" style="animation-delay:${i*0.08}s">
        <div class="round-title">${esc(rd.title)}</div>
        ${rd.duration ? `<div class="round-note">⏱ ${esc(rd.duration)}</div>` : ''}
        <div class="round-desc">${esc(rd.description)}</div>
        ${criteria}
        ${rd.note ? `<div class="round-note">${esc(rd.note)}</div>` : ''}
      </div>
    `;
  }).join('');
  return `<div class="rounds-list">${items}</div>`;
}

function buildRules(rules) {
  const items = rules.map((rule, i) => `
    <li style="animation-delay:${0.05 + i*0.06}s">
      <span class="rule-num">${String(i+1).padStart(2,'0')}</span>
      <span class="rule-text">${esc(rule)}</span>
    </li>
  `).join('');
  return `<ul class="rules-list">${items}</ul>`;
}

function buildScoring(scoring) {
  const rows = scoring.placement.map(p => `
    <tr>
      <td>${esc(p.rank)}</td>
      <td>${p.points}</td>
    </tr>
  `).join('');
  return `
    <div class="scoring-wrap">
      <table class="scoring-table">
        <thead><tr><th>Placement</th><th>Points</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="kill-note">🔫 ${esc(scoring.kill_points)}</div>
    </div>
  `;
}

function buildJudging(judging) {
  const items = judging.map((j, i) => `
    <li style="animation-delay:${0.05 + i*0.06}s">
      <span class="judging-bullet">✓</span>
      <span class="judging-text">${esc(j)}</span>
    </li>
  `).join('');
  return `<ul class="judging-list">${items}</ul>`;
}

function buildDQ(dq) {
  const items = dq.map((d, i) => `
    <li style="animation-delay:${0.05 + i*0.06}s">
      <span class="dq-bullet">✕</span>
      <span class="dq-text">${esc(d)}</span>
    </li>
  `).join('');
  return `<ul class="dq-list">${items}</ul>`;
}

/* ════════════════════════════════
   STARFIELD
════════════════════════════════ */
function initStarfield() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    stars = Array.from({length:140}, () => ({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      r: Math.random()*1.1+0.2, a: Math.random(), s: Math.random()*0.004+0.001
    }));
  }
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s => {
      s.a += s.s; if(s.a>1) s.a=0;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,230,255,${s.a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); draw();
  window.addEventListener('resize', resize);
}

/* ════════════════════════════════
   CARD SCROLL REVEAL
════════════════════════════════ */
function initCardReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.querySelectorAll('.rules-card').forEach((c,i) => {
          c.style.animationDelay = `${i*0.06}s`;
          c.style.animationName  = 'none';
          requestAnimationFrame(() => { c.style.animationName = 'cardReveal'; });
        });
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.05 });
  document.querySelectorAll('.rules-grid').forEach(g => obs.observe(g));
}

/* ════════════════════════════════
   HELPERS
════════════════════════════════ */
function el(tag, attrs={}) {
  const n = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k,v));
  return n;
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
