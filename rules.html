<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Event Rules — EMINENCE 2K26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rules.css">
</head>
<body>

<!-- Starfield -->
<canvas id="stars"></canvas>

<!-- ══ HEADER ══ -->
<header class="rules-header">
  <div class="header-brand">
    <div class="header-logo">EMINENCE 2K26</div>
    <div class="header-sub">Event Rules</div>
  </div>
  <nav class="header-nav">
    <button class="nav-btn" id="backBtn" onclick="showGrid()">← All Events</button>
    <a class="nav-btn" href="index.html">🏠 Home</a>
    <a class="nav-btn register" id="headerRegister" href="#" target="_blank" rel="noopener" style="display:none">
      Register →
    </a>
  </nav>
</header>

<!-- ══ APP ══ -->
<main id="rulesApp">
  <p class="loading-msg">Loading events…</p>
</main>

<script>
/* ════════════════════════════════════
   DATA LAYER
════════════════════════════════════ */
let eventsData = null;

document.addEventListener('DOMContentLoaded', () => {
  // Fetch both files in parallel — rulebook.json is separate from events.json
  Promise.all([
    fetch('events.json').then(r => { if (!r.ok) throw new Error('Cannot load events.json'); return r.json(); }),
    fetch('rulebook.json').then(r  => { if (!r.ok) throw new Error('Cannot load rulebook.json');  return r.json(); })
  ])
    .then(([evData, rulesData]) => {
      eventsData = evData;
      rulesData  = rulesData; // store globally
      window._rulesData = rulesData;
      initStarfield();
      router(); // handle initial URL hash
    })
    .catch(err => {
      document.getElementById('rulesApp').innerHTML =
        `<p class="loading-msg">⚠️ ${err.message}</p>`;
    });

  window.addEventListener('hashchange', router);
});

/* ════════════════════════════════════
   ROUTER  — #event/categoryId/index
════════════════════════════════════ */
function router() {
  const hash = location.hash; // e.g. "#event/technical/0"
  const match = hash.match(/^#event\/([^/]+)\/(\d+)$/);

  if (match) {
    const catId  = match[1];
    const evIdx  = parseInt(match[2], 10);
    const cat    = eventsData?.categories.find(c => c.id === catId);
    const ev     = cat?.events[evIdx];
    if (cat && ev) {
      showDetail(cat, ev, evIdx);
      return;
    }
  }
  showGrid();
}

/* ════════════════════════════════════
   GRID VIEW — all events
════════════════════════════════════ */
function showGrid() {
  // Update header
  document.getElementById('backBtn').style.display      = 'none';
  document.getElementById('headerRegister').style.display = 'none';
  document.title = 'Event Rules — EMINENCE 2K26';
  if (location.hash.startsWith('#event')) history.pushState('', '', location.pathname);

  const app = document.getElementById('rulesApp');
  app.innerHTML = '';

  // Page hero
  const hero = el('div', { class: 'page-hero' });
  hero.innerHTML = `
    <div class="page-hero-label">EMINENCE 2K26</div>
    <h1 class="page-hero-title">Event Rules</h1>
    <p class="page-hero-sub">Select an event to view its rules &amp; regulations</p>
  `;
  app.appendChild(hero);

  // Categories
  eventsData.categories.forEach(cat => {
    const section = el('div', { class: 'cat-section' });

    const isNontech = cat.theme === 'nontech';
    section.innerHTML = `
      <div class="cat-heading-row">
        <div class="cat-heading-line ${isNontech ? 'nontech-l' : ''}"></div>
        <h2 class="cat-heading-title ${cat.theme}">${cat.emoji} ${esc(cat.label)}</h2>
        <div class="cat-heading-line ${isNontech ? 'nontech-r' : 'r'}"></div>
      </div>
    `;

    const grid = el('div', { class: `rules-grid${isNontech ? ' nontech-grid' : ''}` });

    cat.events.forEach((ev, i) => {
      const card = el('div', {
        class: 'rules-card',
        role: 'button',
        tabindex: '0',
        style: `animation-delay:${i * 0.06}s`,
        'data-cat': cat.id,
        'data-idx': i
      });
      card.innerHTML = `
        <div class="rc-emoji">${ev.emoji}</div>
        <div class="rc-name">${esc(ev.name)}</div>
        <div class="rc-hint">View Rules →</div>
      `;
      card.addEventListener('click', () => {
        location.hash = `#event/${cat.id}/${i}`;
      });
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') location.hash = `#event/${cat.id}/${i}`;
      });
      grid.appendChild(card);
    });

    section.appendChild(grid);
    app.appendChild(section);
  });

  // Scroll reveal for cards
  window.scrollTo({ top: 0, behavior: 'instant' });
  initCardReveal();
}

/* ════════════════════════════════════
   DETAIL VIEW — single event rules
════════════════════════════════════ */
function showDetail(cat, ev, evIdx) {
  const isNontech = cat.theme === 'nontech';

  // Look up rules from the separate rulebook.json (keyed by categoryId__eventIndex)
  const key      = `${cat.id}__${evIdx}`;
  const ruleMeta = (window._rulesData || {})[key] || {};

  // Merge rule metadata onto the event object for display
  const tagline  = ruleMeta.tagline  || '';
  const team     = ruleMeta.team     || '';
  const duration = ruleMeta.duration || '';
  const rulesList = ruleMeta.rules   || [];

  // Update header
  document.getElementById('backBtn').style.display = 'inline-flex';
  const regBtn = document.getElementById('headerRegister');
  regBtn.style.display = 'inline-flex';
  regBtn.href = ev.link || '#';
  document.title = `${ev.name} Rules — EMINENCE 2K26`;

  const app = document.getElementById('rulesApp');
  app.innerHTML = '';

  const wrap = el('div', { class: `detail-wrap${isNontech ? ' nontech' : ''}` });

  // ── Hero block ──
  const rulesHTML = rulesList.map((rule, i) => `
    <li style="animation-delay:${0.15 + i * 0.07}s">
      <span class="rule-num">${String(i + 1).padStart(2, '0')}</span>
      <span class="rule-text">${esc(rule)}</span>
    </li>
  `).join('');

  wrap.innerHTML = `
    <!-- Event hero -->
    <div class="detail-hero">
      <span class="detail-emoji">${ev.emoji}</span>
      <h1 class="detail-name">${esc(ev.name)}</h1>
      ${tagline  ? `<p class="detail-tagline">${esc(tagline)}</p>` : ''}
      <div class="detail-meta">
        ${team     ? `<span class="meta-chip">👥 ${esc(team)}</span>`             : ''}
        ${duration ? `<span class="meta-chip purple">⏱ ${esc(duration)}</span>` : ''}
        <span class="meta-chip">${esc(cat.label)}</span>
      </div>
    </div>

    <div class="detail-divider"></div>

    <!-- Rules box -->
    <div class="rules-box">
      <div class="rules-box-header">
        <span style="font-size:1rem">📋</span>
        <span class="rules-box-title">Rules &amp; Regulations</span>
      </div>
      <ul class="rules-list">
        ${rulesHTML || '<li><span class="rule-num">—</span><span class="rule-text">Rules coming soon.</span></li>'}
      </ul>
    </div>

    <!-- CTA -->
    <div class="detail-cta">
      <a class="cta-btn cta-register" href="${esc(ev.link || '#')}" target="_blank" rel="noopener">
        ✦ Register Now
      </a>
      <button class="cta-btn cta-back" onclick="showGrid()">
        ← All Events
      </button>
    </div>
  `;

  app.appendChild(wrap);
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ════════════════════════════════════
   STARFIELD
════════════════════════════════════ */
function initStarfield() {
  const canvas = document.getElementById('stars');
  const ctx    = canvas.getContext('2d');
  let stars    = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 140 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.1 + 0.2,
      a: Math.random(),
      s: Math.random() * 0.004 + 0.001
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a += s.s; if (s.a > 1) s.a = 0;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,230,255,${s.a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); draw();
  window.addEventListener('resize', resize);
}

/* ════════════════════════════════════
   CARD REVEAL ON SCROLL
════════════════════════════════════ */
function initCardReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.querySelectorAll('.rules-card').forEach((c, i) => {
          c.style.animationDelay = `${i * 0.06}s`;
          c.style.animationName  = 'none';
          requestAnimationFrame(() => { c.style.animationName = 'cardReveal'; });
        });
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.05 });
  document.querySelectorAll('.rules-grid').forEach(g => obs.observe(g));
}

/* ════════════════════════════════════
   HELPERS
════════════════════════════════════ */
function el(tag, attrs = {}) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
